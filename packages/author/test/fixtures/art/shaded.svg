<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4e89"/>
      <stop offset="0.6" stop-color="#7fb2e5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4e1c1"/>
    </linearGradient>
    <radialGradient id="shadow-fade">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-glow" gradientUnits="userSpaceOnUse" cx="250" cy="40" r="30" fx="240" fy="35" gradientTransform="rotate(20 250 40)">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#f2a33a"/>
    </radialGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="300" y2="0" gradientTransform="skewX(20)">
      <stop offset="0" stop-color="#5a4320"/>
      <stop offset="0.5" stop-color="#5a4320"/>
      <stop offset="0.5" stop-color="#c9a26b"/>
      <stop offset="1" stop-color="#c9a26b"/>
    </linearGradient>
    <linearGradient id="roof-tone" xlink:href="#sky" x1="0" y1="0" x2="1" y2="0"/>
    <clipPath id="porthole"><circle cx="35" cy="40" r="25"/></clipPath>
    <clipPath id="lens" clipPathUnits="objectBoundingBox"><ellipse cx="0.5" cy="0.5" rx="0.5" ry="0.35"/></clipPath>
    <clipPath id="halves"><rect x="200" y="110" width="20" height="40"/><rect x="220" y="110" width="20" height="40"/></clipPath>
    <clipPath id="dot"><circle cx="290" cy="150" r="12"/></clipPath>
  </defs>
  <rect id="backdrop" width="320" height="180" fill="url(#sky)"/>
  <ellipse id="shadow" cx="120" cy="150" rx="70" ry="12" fill="url(#shadow-fade)"/>
  <circle id="sun" cx="250" cy="40" r="30" fill="url(#sun-glow)"/>
  <rect id="card" x="70" y="60" width="100" height="70" rx="8" fill="url(#roof-tone)" stroke="url(#rail)" stroke-width="4"/>
  <polyline id="fence" points="20,160 300,160" fill="none" stroke="url(#rail)" stroke-width="6"/>
  <g id="window" clip-path="url(#porthole)">
    <rect x="15" y="20" width="30" height="30" fill="#e07a5f"/>
    <rect x="30" y="30" width="30" height="30" fill="#3d405b" opacity="0.8"/>
  </g>
  <rect id="tile" x="180" y="70" width="40" height="30" transform="rotate(15 200 85)" fill="url(#roof-tone)" clip-path="url(#lens)"/>
  <g id="pair" clip-path="url(#halves)"><circle cx="220" cy="130" r="25" fill="#81b29a"/></g>
  <g id="holder"><g id="fader"><g id="inner" clip-path="url(#dot)"><rect x="280" y="140" width="20" height="20" fill="#000"/></g></g></g>
</svg>
