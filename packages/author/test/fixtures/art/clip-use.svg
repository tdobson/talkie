<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 120">
  <!-- Clips as Illustrator's Save As writes them: a <use> of a shape kept in defs. -->
  <g>
    <defs>
      <rect id="SVGID_1_" x="30" y="20" width="140" height="80" rx="16"/>
    </defs>
    <clipPath id="SVGID_2_">
      <use xlink:href="#SVGID_1_" style="overflow:visible;"/>
    </clipPath>
    <g id="card" style="clip-path:url(#SVGID_2_);">
      <rect x="0" y="0" width="200" height="120" fill="#81b29a"/>
      <circle cx="170" cy="100" r="50" fill="#f2cc8f"/>
    </g>
  </g>
  <defs>
    <path id="tri" d="M0 0L20 0L10 16Z" transform="rotate(5)"/>
  </defs>
  <clipPath id="tris">
    <use href="#tri" x="4" y="2" transform="scale(1.5)"/>
  </clipPath>
  <rect id="flag" x="0" y="0" width="50" height="40" fill="#e07a5f" clip-path="url(#tris)"/>
</svg>
