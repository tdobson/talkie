<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talkie player</title>
    <meta name="description" content="Drop a Talkie film (.lottie) and watch it. The file stays on your device." />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #1d3b47;
        --soft: #5b7480;
        --line: #c9d5da;
        --bg: #f4f6f7;
        --accent: #1f6f8b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .lede {
        margin: 0 0 24px;
        color: var(--soft);
      }
      #drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 320px;
        padding: 32px;
        border: 2px dashed var(--line);
        border-radius: 16px;
        background: #fff;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      #drop:hover,
      #drop:focus-visible,
      body.dragging #drop {
        border-color: var(--accent);
        background: #eef6f9;
        outline: none;
      }
      #drop strong {
        font-size: 1.25rem;
      }
      #drop span {
        color: var(--soft);
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.quiet {
        background: transparent;
        color: var(--accent);
      }
      #stage[hidden],
      #drop[hidden] {
        display: none;
      }
      #stage header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      #name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      talkie-player {
        display: block;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      #error {
        margin: 16px 0 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: #fdecea;
        color: #8a1c12;
      }
      #error[hidden] {
        display: none;
      }
      footer {
        margin-top: 24px;
        color: var(--soft);
        font-size: 0.875rem;
      }
      footer a {
        color: var(--accent);
      }
    </style>
    <script type="module" src="./talkie-player.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>Talkie player</h1>
      <p class="lede">Drop a Talkie film here and it plays. The file stays on your device: nothing is uploaded.</p>

      <div id="drop" role="button" tabindex="0" aria-describedby="drop-help">
        <strong>Drop a .lottie film here</strong>
        <span id="drop-help">or click to choose one</span>
        <button type="button" class="quiet" id="sample">Or watch the sample film</button>
      </div>
      <input id="file" type="file" accept=".lottie,application/zip" hidden />

      <section id="stage" hidden>
        <header>
          <span id="name"></span>
          <button type="button" class="quiet" id="another">Play another film</button>
        </header>
        <talkie-player id="player" wasm-url="./dotlottie-player.wasm"></talkie-player>
      </section>

      <p id="error" role="alert" hidden></p>

      <footer>
        Talkie films are vector drawings that move, with a narration track. Make one with the
        <code>talkie</code> command, then drop its <code>dist/film.lottie</code> here.
      </footer>
    </main>
  </body>
</html>
